openapi: 3.1.0

info:
  title: Truelist API
  description: |
    The Truelist email validation API lets you verify email addresses in real time.
    Use it to reduce bounces, block disposable addresses, and keep your lists clean.

    ## Authentication

    All endpoints require a Bearer token in the `Authorization` header:

    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    ## Rate Limits

    | Endpoint              | Limit           |
    |-----------------------|-----------------|
    | `/api/v1/verify_inline` | 10 requests/s |
    | `/api/v1/verify`      | 10 requests/s   |
    | `/me`                 | 10 requests/s   |
    | `/api/v1/credits`     | 10 requests/s   |

    When you exceed a rate limit the API returns `429 Too Many Requests`.

    ## Validation States

    Every verification returns an `email_state` and `email_sub_state`:

    | State           | Meaning                                           |
    |-----------------|---------------------------------------------------|
    | `ok`            | The email address is deliverable.                  |
    | `email_invalid` | The email address is not deliverable.              |
    | `risky`         | The address may be deliverable but carries risk.   |
    | `unknown`       | Deliverability could not be determined.            |
    | `accept_all`    | The mail server accepts all addresses.             |
  version: 1.0.0
  contact:
    name: Truelist Support
    url: https://truelist.io
    email: support@truelist.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

externalDocs:
  description: Truelist API Documentation
  url: https://truelist.io/docs/api

servers:
  - url: https://api.truelist.io
    description: Production

tags:
  - name: Email Validation
    description: Verify email addresses.
  - name: Batch Verification
    description: Upload lists for batch email verification.
  - name: Account
    description: Retrieve account information.
  - name: Credits
    description: Check the credits left to spend.

security:
  - BearerAuth: []

paths:
  /api/v1/verify_inline:
    post:
      operationId: verifyInline
      tags:
        - Email Validation
      summary: Inline email validation
      description: |
        Validate a single email address synchronously. Pass the email as a query
        parameter. No request body is required.

        Returns detailed verification results including email state, domain info,
        and suggested corrections.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
          description: The email address to validate.
          example: "user@example.com"
      responses:
        "200":
          description: Validation result returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InlineVerifyResponse"
              example:
                emails:
                  - address: "user@example.com"
                    domain: "example.com"
                    canonical: "user@example.com"
                    mx_record: null
                    first_name: null
                    last_name: null
                    email_state: "ok"
                    email_sub_state: "email_ok"
                    verified_at: "2026-02-21T10:39:12.570Z"
                    did_you_mean: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/verify:
    post:
      operationId: verifyBatch
      tags:
        - Batch Verification
      summary: Batch email verification
      description: |
        Upload a list of emails for batch verification. This endpoint accepts
        a file (CSV/XLSX) or JSON array of emails and processes them in the
        background.

        This is NOT the same as inline verification. Use `/api/v1/verify_inline`
        for synchronous single-email validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchVerifyRequest"
            example:
              emails:
                - "user1@example.com"
                - "user2@example.com"
      responses:
        "200":
          description: Batch verification started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchVerifyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /me:
    get:
      operationId: getMe
      tags:
        - Account
      summary: Get account information
      description: |
        Retrieve your account details including name, email, UUID, time zone,
        role, API keys, and account plan information.
      responses:
        "200":
          description: Account information returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
              example:
                email: "team@company.com"
                name: "Team Lead"
                uuid: "a3828d19-1234-5678-9abc-def012345678"
                time_zone: "America/New_York"
                is_admin_role: true
                token: "abc123"
                api_keys: []
                account:
                  name: "Company Inc"
                  payment_plan: "pro"
                  users: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/credits:
    get:
      operationId: getCreditBalance
      tags:
        - Credits
      summary: Get credit balance
      description: |
        Return the validation credits left on the account that owns the API key.
        Use it to show a balance or to check there are enough credits before
        validating a list.

        This call is free: it never spends or reserves credits. It counts
        against the same rate limit as other API requests.

        Use `available_credits`, not `balance`, to decide whether the account can
        validate now. `reserved_credits` are held by batches that are still running.

        Accounts on a legacy plan (not pay-as-you-go or Unlimited) don't use
        credits. For those the response has `uses_credits: false` and a `message`
        instead of credit numbers.
      responses:
        "200":
          description: Credit balance returned successfully.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CreditBalance"
                  - $ref: "#/components/schemas/LegacyCreditBalance"
              examples:
                payAsYouGo:
                  summary: Pay-as-you-go plan
                  value:
                    payment_plan: "payg_v7"
                    uses_credits: true
                    unlimited_standard_validations: false
                    available_credits: 9470
                    balance: 10000
                    reserved_credits: 530
                    enhanced_grant: null
                    auto_topup:
                      enabled: true
                      credit_amount: 10000
                      threshold: 2000
                      disabled_reason: null
                    credit_costs:
                      standard: 1
                      enhanced: 3
                      unknown: 0
                      accept_all: 0
                unlimited:
                  summary: Unlimited plan
                  value:
                    payment_plan: "unlimited_v7"
                    uses_credits: true
                    unlimited_standard_validations: true
                    available_credits: 500
                    balance: 500
                    reserved_credits: 0
                    enhanced_grant:
                      remaining: 7500
                      total: 10000
                      period_end: "2026-12-20"
                    auto_topup:
                      enabled: false
                      credit_amount: null
                      threshold: 0
                      disabled_reason: null
                    credit_costs:
                      standard: 1
                      enhanced: 3
                      unknown: 0
                      accept_all: 0
                legacy:
                  summary: Legacy plan
                  value:
                    payment_plan: "growth_v5"
                    uses_credits: false
                    message: "This account is on a legacy plan that does not use validation credits."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key for authentication. Pass as `Authorization: Bearer YOUR_API_KEY`.

  schemas:
    EmailResult:
      type: object
      required:
        - address
        - domain
        - email_state
        - email_sub_state
        - verified_at
      properties:
        address:
          type: string
          format: email
          description: The email address that was validated.
        domain:
          type: string
          description: The domain part of the email address.
        canonical:
          type: string
          description: The canonical form of the email address.
        mx_record:
          type:
            - string
            - "null"
          description: The MX record for the domain, or null if not found.
        first_name:
          type:
            - string
            - "null"
          description: First name associated with the email, if detected.
        last_name:
          type:
            - string
            - "null"
          description: Last name associated with the email, if detected.
        email_state:
          $ref: "#/components/schemas/EmailState"
        email_sub_state:
          $ref: "#/components/schemas/EmailSubState"
        verified_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the verification was performed.
        did_you_mean:
          type:
            - string
            - "null"
          description: |
            A suggested correction if the email appears to contain a typo.
            Null when there is no suggestion.

    InlineVerifyResponse:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          items:
            $ref: "#/components/schemas/EmailResult"
          description: Array of verification results.

    BatchVerifyRequest:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
          description: Array of email addresses to verify.

    BatchVerifyResponse:
      type: object
      description: Response from batch verification submission.

    MeResponse:
      type: object
      required:
        - email
        - name
        - uuid
      properties:
        email:
          type: string
          format: email
          description: The email address associated with the account.
        name:
          type: string
          description: The account holder's name.
        uuid:
          type: string
          format: uuid
          description: Unique identifier for the user.
        time_zone:
          type: string
          description: The user's time zone.
        is_admin_role:
          type: boolean
          description: Whether the user has admin privileges.
        token:
          type: string
          description: Authentication token.
        api_keys:
          type: array
          items:
            type: object
          description: List of API keys associated with the account.
        account:
          $ref: "#/components/schemas/AccountInfo"

    AccountInfo:
      type: object
      properties:
        name:
          type: string
          description: The account/organization name.
        payment_plan:
          type: string
          description: The current subscription plan.
        users:
          type: array
          items:
            type: object
          description: List of users on the account.

    CreditBalance:
      type: object
      required:
        - payment_plan
        - uses_credits
        - unlimited_standard_validations
        - available_credits
        - balance
        - reserved_credits
        - enhanced_grant
        - auto_topup
        - credit_costs
      properties:
        payment_plan:
          type: string
          description: The account's plan, `payg_v7` or `unlimited_v7`.
        uses_credits:
          type: boolean
          const: true
          description: Always `true` for plans that spend credits.
        unlimited_standard_validations:
          type: boolean
          description: |
            `true` on the Unlimited plan, where standard validations are free and
            credits only pay for enhanced validation.
        available_credits:
          type: integer
          description: Credits that can be spent now (`balance` minus `reserved_credits`).
        balance:
          type: integer
          description: All credits on the account, including reserved ones. Credits never expire.
        reserved_credits:
          type: integer
          description: Credits held by batches that are still running.
        enhanced_grant:
          description: |
            The monthly enhanced-validation allotment. Set only on the Unlimited
            plan; `null` otherwise.
          oneOf:
            - $ref: "#/components/schemas/EnhancedGrant"
            - type: "null"
        auto_topup:
          $ref: "#/components/schemas/AutoTopUp"
        credit_costs:
          $ref: "#/components/schemas/CreditCosts"

    EnhancedGrant:
      type: object
      required:
        - remaining
        - total
        - period_end
      properties:
        remaining:
          type: integer
          description: Enhanced credits left in this period. `0` once the period has ended.
        total:
          type: integer
          description: Enhanced credits granted for the period.
        period_end:
          type:
            - string
            - "null"
          format: date
          description: Last day of the current grant period. The allotment renews after it.

    AutoTopUp:
      type: object
      required:
        - enabled
        - credit_amount
        - threshold
        - disabled_reason
      properties:
        enabled:
          type: boolean
          description: Whether credits are bought automatically when the balance runs low.
        credit_amount:
          type:
            - integer
            - "null"
          description: Credits bought on each top-up.
        threshold:
          type: integer
          description: Available credits at or below which a top-up is bought.
        disabled_reason:
          type:
            - string
            - "null"
          description: Why auto top-up was turned off (for example after a failed charge).

    CreditCosts:
      type: object
      description: Credits each validation outcome costs.
      required:
        - standard
        - enhanced
        - unknown
        - accept_all
      properties:
        standard:
          type: integer
          description: A standard validation.
        enhanced:
          type: integer
          description: |
            An enhanced validation, charged only when the extra checks resolve an
            otherwise uncertain address (otherwise it costs the standard rate).
        unknown:
          type: integer
          description: A result of `unknown` is free.
        accept_all:
          type: integer
          description: A result of `accept_all` is free.

    LegacyCreditBalance:
      type: object
      required:
        - payment_plan
        - uses_credits
        - message
      properties:
        payment_plan:
          type: string
          description: The account's plan.
        uses_credits:
          type: boolean
          const: false
          description: Always `false`. Legacy plans don't spend credits.
        message:
          type: string
          description: A short explanation.

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: A human-readable error message.

    EmailState:
      type: string
      enum:
        - ok
        - email_invalid
        - risky
        - unknown
        - accept_all
      description: |
        The overall validation verdict for the email address.

        - `ok` -- The email address is deliverable.
        - `email_invalid` -- The email address is not deliverable.
        - `risky` -- The address may be deliverable but carries risk.
        - `unknown` -- Deliverability could not be determined.
        - `accept_all` -- The mail server accepts all addresses.

    EmailSubState:
      type: string
      enum:
        - email_ok
        - is_disposable
        - is_role
        - unknown_error
        - failed_smtp_check
      description: |
        A more specific reason for the validation state.

        - `email_ok` -- Passed all checks.
        - `is_disposable` -- The email belongs to a disposable / temporary provider.
        - `is_role` -- The email is a role-based address (e.g. info@, admin@).
        - `unknown_error` -- The sub-state could not be determined.
        - `failed_smtp_check` -- The SMTP check failed for this address.

  responses:
    Unauthorized:
      description: Authentication failed. The API key is missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Unauthorized"

    RateLimitExceeded:
      description: |
        Too many requests. You have exceeded the rate limit for this endpoint.
        Wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Rate limit exceeded"

    InternalServerError:
      description: An unexpected error occurred on the server. Try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Internal server error"
